name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enquanto o app Vite não existe, publica a pasta site/ como está (página provisória).
      # Quando existir site/package.json, instala, testa, gera o build e publica site/dist.
      - name: Detectar app Vite
        id: tipo
        run: |
          if [ -f site/package.json ]; then
            echo "vite=true" >> "$GITHUB_OUTPUT"
            echo "dir=site/dist" >> "$GITHUB_OUTPUT"
          else
            echo "vite=false" >> "$GITHUB_OUTPUT"
            echo "dir=site" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.tipo.outputs.vite == 'true'
        with:
          node-version: 22

      - name: Instalar, testar e gerar o build
        if: steps.tipo.outputs.vite == 'true'
        working-directory: site
        run: |
          npm ci
          npm test --if-present
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.tipo.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v4
