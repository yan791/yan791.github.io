  <style>
    :root{--tinta:#080B13;--painel:#0D1220;--linha:#2A3550;--texto:#ECEEF3;--texto-2:#9CA4B8;--sinal:#FF5B22}
    *{box-sizing:border-box;margin:0}
    html,body{height:100%}
    body{background:var(--tinta);color:var(--texto);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(640px,100%)}
    .marca{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;font-size:15px;color:var(--texto-2);letter-spacing:.04em}
    .cursor{display:inline-block;width:.6em;height:1.05em;background:var(--sinal);vertical-align:-.15em;margin-left:2px;animation:pisca 1.2s steps(1) infinite}
    @keyframes pisca{50%{opacity:0}}
    h1{font-size:clamp(40px,9vw,72px);line-height:1;letter-spacing:-.02em;margin:28px 0 16px;font-weight:750}
    p{color:var(--texto-2);font-size:18px;line-height:1.55;max-width:46ch}
    .estado{font-family:ui-monospace,Consolas,monospace;font-size:13px;margin-top:28px;padding:14px 16px;border:1px solid var(--linha);border-radius:10px;background:var(--painel);color:var(--texto-2)}
    .estado b{color:var(--sinal);font-weight:500}
    nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
    a{color:var(--texto);text-decoration:none;border:1px solid var(--linha);border-radius:999px;padding:12px 18px;font-size:15px;transition:border-color .32s cubic-bezier(.22,1,.36,1),color .32s cubic-bezier(.22,1,.36,1)}
    a:hover{border-color:var(--sinal)}
    a:focus-visible{outline:2px solid var(--sinal);outline-offset:3px}
  </style>
